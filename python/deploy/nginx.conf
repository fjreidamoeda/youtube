# Nginx na frente do app. Ajuste server_name e o caminho do certificado.
#
# O ponto critico: NUNCA usar buffer/proxy_cache no /stream.php, porque o
# MPEG-TS e um fluxo continuo e o painel aborta a conexao se o nginx segurar
# os bytes.

server {
    listen 80;
    server_name iptv.seudominio.com;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # playlist e EPG: podem ser cacheados por alguns minutos
    location ~ ^/(lista\.php|epg\.php) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 5m;
    }

    # streams: sem buffer, sem timeout curto
    location ~ ^/stream\.php {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host    $host;
        proxy_set_header Range   $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }
}
